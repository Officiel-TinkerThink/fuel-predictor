# Production deployment (ADR 0012). Standalone, not an overlay on compose.yaml.
#
#   docker compose -f compose.prod.yaml up -d
#
# Deliberately a complete file rather than `-f compose.yaml -f compose.prod.yaml`:
# Compose *merges* `ports` lists across files and cannot unpublish a port an
# earlier file published. An overlay would therefore leave the application and
# MLflow reachable on the host, bypassing the gateway entirely. Duplicating a
# little configuration is the cheaper mistake.
#
# Nothing here publishes a host port except Caddy. The application, database,
# and MLflow are reachable only on the internal Compose network.
#
# app, mlflow, and monitor all run the same image - CI builds it once and
# pushes it to GHCR (.github/workflows/deploy.yml), so it is pulled here
# rather than built locally. IMAGE_TAG defaults to latest for a manual
# `docker compose up`; the deploy job pins it to the commit SHA it just built.
x-app-image: &app-image
  image: ghcr.io/officiel-tinkerthink/fuel-predictor:${IMAGE_TAG:-latest}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuel_predictor
      POSTGRES_USER: fuel_predictor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_predictor -d fuel_predictor"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    <<: *app-image
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,mlflow,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mlflow_data:/mlflow

  app:
    <<: *app-image
    restart: unless-stopped
    # ADR 0012 assumes Caddy is bundled into this same compose project and
    # reaches app over the internal network, so app normally publishes
    # nothing. This VM's Caddy is a separate, externally-managed container
    # fronting several projects (see docs/production/ci-cd.md) - it can only
    # reach app via a host port, exactly as the previous manually-run
    # deployment published it.
    ports:
      - "8000:8000"
    # --proxy-headers makes uvicorn honour X-Forwarded-Proto/For, and
    # --forwarded-allow-ips restricts that trust to the gateway. Without the
    # second flag any client could claim any source address by setting a
    # header, which would poison the audit trail and the rate limiter.
    command: >
      sh -c "alembic upgrade head &&
      uvicorn fuel_predictor.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=${FUEL_PREDICTOR_FORWARDED_ALLOW_IPS:-*}"
    environment:
      FUEL_PREDICTOR_DATABASE_URL: postgresql+psycopg://fuel_predictor:${POSTGRES_PASSWORD}@db:5432/fuel_predictor
      FUEL_PREDICTOR_MLFLOW_TRACKING_URI: http://mlflow:5000
      # The https origin agents reach /mcp at. Required for OAuth (ADR 0014):
      # the CDN in front of the shared Caddy talks plain HTTP to it, so the
      # scheme that reaches app is http and cannot be trusted for discovery.
      FUEL_PREDICTOR_PUBLIC_URL: ${FUEL_PREDICTOR_PUBLIC_URL:-}
      FUEL_PREDICTOR_BOOTSTRAP_ADMIN_USERNAME: ${FUEL_PREDICTOR_BOOTSTRAP_ADMIN_USERNAME:-}
      FUEL_PREDICTOR_BOOTSTRAP_ADMIN_PASSWORD: ${FUEL_PREDICTOR_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Without this the deployment has no routing provider at all: every
      # plan entered as a stop sequence is refused until a manual distance is
      # typed, and the route preview never draws. compose.yaml already passed
      # it through; this file did not, which is how the dev site ended up
      # asking for "jarak total cadangan" on every operation.
      FUEL_PREDICTOR_GOOGLE_MAPS_API_KEY: ${FUEL_PREDICTOR_GOOGLE_MAPS_API_KEY:-}
      FUEL_PREDICTOR_ALERT_WEBHOOK_URL: ${FUEL_PREDICTOR_ALERT_WEBHOOK_URL:-}
      FUEL_PREDICTOR_ALERT_SMTP_HOST: ${FUEL_PREDICTOR_ALERT_SMTP_HOST:-}
      FUEL_PREDICTOR_ALERT_SMTP_PORT: ${FUEL_PREDICTOR_ALERT_SMTP_PORT:-587}
      FUEL_PREDICTOR_ALERT_SMTP_USERNAME: ${FUEL_PREDICTOR_ALERT_SMTP_USERNAME:-}
      FUEL_PREDICTOR_ALERT_SMTP_PASSWORD: ${FUEL_PREDICTOR_ALERT_SMTP_PASSWORD:-}
      FUEL_PREDICTOR_ALERT_EMAIL_SENDER: ${FUEL_PREDICTOR_ALERT_EMAIL_SENDER:-}
      FUEL_PREDICTOR_ALERT_EMAIL_RECIPIENTS: ${FUEL_PREDICTOR_ALERT_EMAIL_RECIPIENTS:-}
      FUEL_PREDICTOR_MODEL_ARTIFACT_DIRECTORY: /data/model-packages
      # Pinned rather than left to the default, so this stays true even if the
      # default is ever loosened: no accounts means locked, not wide open.
      FUEL_PREDICTOR_ALLOW_UNPROVISIONED_ACCESS: "false"
      FUEL_PREDICTOR_MCP_PRIVILEGED_TOOLS_ENABLED: ${FUEL_PREDICTOR_MCP_PRIVILEGED_TOOLS_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/sehat')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - model_packages:/data/model-packages

  caddy:
    # Opt-in: a deployment with its own proxy (ADR 0012) never activates this
    # profile, so `docker compose` skips this service entirely - including
    # requiring DOMAIN/ACME_EMAIL - rather than just leaving it unstarted.
    profiles: ["bundled-proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive a restart. Without this volume Caddy re-requests
      # them on every deploy and hits Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Runs the scheduled monitoring recompute and alert delivery. A plain sleep
  # loop rather than host cron: it ships with the deployment, so an operator
  # cannot forget to install it, and it exits non-zero into the container log
  # where the restart policy makes a persistently failing job visible.
  monitor:
    <<: *app-image
    restart: unless-stopped
    command: >
      sh -c "while true; do
      python -m fuel_predictor monitor --trigger scheduled || true;
      sleep 86400;
      done"
    environment:
      FUEL_PREDICTOR_DATABASE_URL: postgresql+psycopg://fuel_predictor:${POSTGRES_PASSWORD}@db:5432/fuel_predictor
      FUEL_PREDICTOR_ALERT_WEBHOOK_URL: ${FUEL_PREDICTOR_ALERT_WEBHOOK_URL:-}
      FUEL_PREDICTOR_ALERT_SMTP_HOST: ${FUEL_PREDICTOR_ALERT_SMTP_HOST:-}
      FUEL_PREDICTOR_ALERT_SMTP_PORT: ${FUEL_PREDICTOR_ALERT_SMTP_PORT:-587}
      FUEL_PREDICTOR_ALERT_SMTP_USERNAME: ${FUEL_PREDICTOR_ALERT_SMTP_USERNAME:-}
      FUEL_PREDICTOR_ALERT_SMTP_PASSWORD: ${FUEL_PREDICTOR_ALERT_SMTP_PASSWORD:-}
      FUEL_PREDICTOR_ALERT_EMAIL_SENDER: ${FUEL_PREDICTOR_ALERT_EMAIL_SENDER:-}
      FUEL_PREDICTOR_ALERT_EMAIL_RECIPIENTS: ${FUEL_PREDICTOR_ALERT_EMAIL_RECIPIENTS:-}
    depends_on:
      db:
        condition: service_healthy

  # A daily database dump kept seven days on this machine (deploy/local-backup.sh).
  # Until the encrypted off-site backup (deploy/backup.sh, ADR 0012) has its
  # key and remote, nothing else backs the database up; this survives a
  # mistaken deletion, a bad migration or a corrupted table, not the loss of
  # the machine. The postgres image, so pg_dump matches the server.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/deploy/local-backup.sh"]
    environment:
      PGHOST: db
      PGUSER: fuel_predictor
      PGDATABASE: fuel_predictor
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./deploy/local-backup.sh:/deploy/local-backup.sh:ro
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  db_backups:
  mlflow_data:
  model_packages:
  caddy_data:
  caddy_config:
