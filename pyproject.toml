[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fuel-predictor"
version = "0.1.0"
description = "Aplikasi lokal perencanaan operasi harian dan prediksi bahan bakar"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "evidently>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "jsonschema>=4.23,<5",
    "mlflow>=2.20,<4",
    "onnxruntime>=1.20,<2",
    "openpyxl>=3.1,<4",
    "psutil>=5.9,<8",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "scikit-learn>=1.6,<2",
    "skops>=0.11,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
    "types-openpyxl>=3.1,<4",
    "types-psutil>=5.9,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fuel_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fuel_predictor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
