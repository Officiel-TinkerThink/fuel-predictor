services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuel_predictor
      POSTGRES_USER: fuel_predictor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel_predictor -d fuel_predictor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on the loopback only, so the application can be run from the
    # host against this database without exposing it to the network.
    ports:
      - "127.0.0.1:5432:5432"

  mlflow:
    build: .
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,mlflow,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"

  app:
    build: .
    environment:
      FUEL_PREDICTOR_DATABASE_URL: postgresql+psycopg://fuel_predictor:${POSTGRES_PASSWORD}@db:5432/fuel_predictor
      FUEL_PREDICTOR_MLFLOW_TRACKING_URI: http://mlflow:5000
      # Without these the stack comes up with an empty users table, which means
      # locked out rather than open (allow_unprovisioned_access is false).
      # compose.prod.yaml passes them the same way.
      FUEL_PREDICTOR_BOOTSTRAP_ADMIN_USERNAME: ${FUEL_PREDICTOR_BOOTSTRAP_ADMIN_USERNAME:-}
      FUEL_PREDICTOR_BOOTSTRAP_ADMIN_PASSWORD: ${FUEL_PREDICTOR_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  mlflow_data:
