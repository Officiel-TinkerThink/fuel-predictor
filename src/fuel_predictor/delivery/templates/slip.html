<!DOCTYPE html>
<html lang="id" data-theme="light" data-theme-locked>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · Fuel Matrix Calculation</title>
  <script src="/statis/theme.js?v={{ static_version('theme.js') }}"></script>
  <link rel="stylesheet" href="/statis/app.css?v={{ static_version('app.css') }}">
  <link rel="icon" href="/statis/favicon.svg?v={{ static_version('favicon.svg') }}" type="image/svg+xml">
</head>
{# A paper slip, always light: it is printed, and on screen it previews the
   paper. The code is what the operator carries to the fuel point and types
   back in Catat Aktual. #}
{% import "_slip.html" as slips %}
<body class="slip-page">
<main class="slip">
  <div class="slip__actions" data-print-actions>
    <button type="button" class="button" data-print onclick="window.print()">Cetak slip</button>
    <a class="button button--secondary" href="/operasi-harian/{{ operation.operation_id }}">Kembali ke estimasi</a>
  </div>

  {{ slips.slip_sheet(operation, prediction, vehicle) }}
</main>
</body>
</html>
