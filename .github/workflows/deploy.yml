name: Deploy

# Only `local` is a deploy branch (ADR: production runs from `local`, not
# `main`). Pushing anywhere else never touches the home server.
on:
  push:
    branches: [local]

env:
  REGISTRY: ghcr.io

jobs:
  # Static checks plus collection, not full execution: a meaningful share of
  # the suite trains real scikit-learn models and writes to MLflow/Evidently,
  # which is legitimate as integration coverage but far too slow to sit in the
  # path of every push (tens of minutes). --collect-only still imports every
  # test module and resolves every fixture, so a broken import, a bad fixture,
  # or a syntax error is still caught here in seconds. Running the fast
  # majority of actual tests too would need the slow ones marked (e.g.
  # `@pytest.mark.slow` + `pytest -m "not slow"`) - worth doing, just not
  # folded into this change.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: python -m ruff check src tests
      - run: python -m mypy src tests
      - run: python -m pytest --collect-only -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io requires a lowercase path; the GitHub org/repo name here has
      # capitals (Officiel-TinkerThink), so this can't just be
      # ghcr.io/${{ github.repository }}.
      - id: image
        run: |
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull the new image and restart the stack
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          # caddy is profile-gated off (compose.prod.yaml) and never named in
          # the commands below, so these values are never actually used - but
          # Compose interpolates every service's environment block up front,
          # before it even looks at which services or profiles are active, so
          # the file fails to parse at all without something here. Real
          # DOMAIN/ACME_EMAIL live in this VM's .env for its actual (shared,
          # externally-managed) Caddy instance - unrelated to this one.
          DOMAIN: unused.invalid
          ACME_EMAIL: unused@example.invalid
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::Set the DEPLOY_PATH repository variable (Settings > Secrets and variables > Actions > Variables) to the fuel-predictor checkout path on the home server." >&2
            exit 1
          fi
          cd "$DEPLOY_PATH"

          # This checkout is deploy-only: always made to match the branch
          # exactly, never hand-edited. .env is gitignored, so it survives.
          git fetch origin local
          git reset --hard origin/local

          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_ACTOR" --password-stdin

          # caddy is deliberately excluded: this VM runs one shared Caddy in
          # front of several projects (not one per app), started outside this
          # compose file and outside this pipeline's control. Naming services
          # explicitly here means this can never start, stop, or recreate it.
          docker compose -f compose.prod.yaml pull app mlflow monitor
          # --wait: the job succeeds only once every service is running and
          # the app and MLflow pass their health checks. Without it a release
          # whose migration or startup failed still reported a green deploy.
          docker compose -f compose.prod.yaml up -d --wait --wait-timeout 300 \
            --remove-orphans app db mlflow monitor backup
          docker image prune -f
